# Week 2 - Day 4: Kubernetes Secret
# Stores sensitive data (values are base64 encoded — NOT encrypted by default!)
# To encode: echo -n "mypassword" | base64
# To decode: echo "bXlwYXNzd29yZA==" | base64 -d

apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
type: Opaque
data:
  db_password: c2VjcmV0         # base64 of "secret"
  db_user: ZGV2b3Bz             # base64 of "devops"

# NOTE for class: In production use Sealed Secrets, Vault, or cloud KMS
# Never commit real secrets to Git!
