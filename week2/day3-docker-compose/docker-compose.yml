# Week 2 - Day 3: Docker Compose Example
# A Flask app + PostgreSQL + Redis stack

version: "3.9"

services:

  # --- Web Application ---
  app:
    build: ./app
    container_name: devops_app
    ports:
      - "8080:5000"
    environment:
      - APP_ENV=development
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=devopsdb
      - DB_USER=devops
      - DB_PASSWORD=secret
      - REDIS_HOST=cache
      - REDIS_PORT=6379
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started
    networks:
      - app-network
    restart: unless-stopped

  # --- PostgreSQL Database ---
  db:
    image: postgres:16-alpine
    container_name: devops_db
    environment:
      - POSTGRES_DB=devopsdb
      - POSTGRES_USER=devops
      - POSTGRES_PASSWORD=secret
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devops -d devopsdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network
    restart: unless-stopped

  # --- Redis Cache ---
  cache:
    image: redis:7-alpine
    container_name: devops_cache
    ports:
      - "6379:6379"
    networks:
      - app-network
    restart: unless-stopped

  # --- Nginx Reverse Proxy ---
  nginx:
    image: nginx:alpine
    container_name: devops_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - app-network
    restart: unless-stopped

# --- Volumes ---
volumes:
  db-data:
    driver: local

# --- Networks ---
networks:
  app-network:
    driver: bridge
